logging:
  file: logs/bot.log
  level: INFO
polymarket:
  clob_api_version: v2
  clob_environment: read_only
  clob_api_url: https://clob.polymarket.com
  clob_v2_read_only_url: https://clob-v2.polymarket.com
  clob_urls:
    production: https://clob.polymarket.com
    staging: https://clob-v2.polymarket.com
    read_only: https://clob-v2.polymarket.com
  gamma_api_url: https://gamma-api.polymarket.com
  assets:
  - btc
  - eth
  - sol
  - xrp
  intervals:
  - 5
  - 15
  fallback_windows: 1
risk:
  circuit_breaker_dd: 0.03
  max_daily_loss: 0.01
  max_position_size: 0.03
  max_risk_per_trade_usd: 2
  # Paper-only exploration mode: keep collecting trade evidence after a paper
  # risk stop would have fired. Live mode still obeys hard stops.
  paper_continue_after_risk_stop: true
filters:
  max_book_spread_bps: 500
  min_top_depth: 2
  min_top_notional: 0.5
  max_depth_ratio: 12
execution:
  paper_starting_bankroll: 500
  mm_paper_max_notional_usd: 6
  min_seconds_to_expiry_for_new_orders: 120
  quote_refresh_seconds: 5
  resolution_initial_poll_seconds: 10
  resolution_poll_cap_seconds: 300
  live_order_approval: false
  directional_order_ttl_enabled: true
  directional_order_ttl_seconds:
    time_decay: 3
    spot_momentum: 5
    opening_range: 10
    mean_reversion_5min: 10
    market_open_probe: 10
    terminal_fair_value: 3
  fill_policy:
    min_rest_seconds: 1.0
    max_fill_fraction_per_snapshot: 0.25
    allow_same_snapshot_fill: false
    max_book_age_ms: 1000
    max_external_spot_age_ms: 1000
    max_ws_lag_ms: 1000
    cancel_latency_ms: 250
strategies:
  # Human-approved exploratory paper-active mode (2026-05-01): run multiple
  # bounded paper strategies across all configured 5/15m markets to collect
  # edge evidence. PAPER ONLY; live mode still requires separate approval.
  active:
  - opening_range
  - terminal_fair_value
  states:
    toxicity_mm: disabled
    toxicity_mm_v2: scanner_only
    time_decay: scanner_only
    mean_reversion_5min: scanner_only
    opening_range: paper_active
    spot_momentum: scanner_only
    market_open_probe: scanner_only
    terminal_fair_value: paper_active
    lag_scanner: scanner_only
    complement_dislocation: scanner_only
  promotion_requires_human_approval: true
  allow_unapproved_activation: false
  candidates:
  - market_open_probe
  - time_decay
  - mean_reversion_5min
  - opening_range
  - spot_momentum
  - terminal_fair_value
  - lag_scanner
  - complement_dislocation
  mean_reversion_5min:
    deviation_threshold: 0.03
    ema_period: 20
    ema_period_5m: 3
    ema_period_15m: 12
    imbalance_threshold: 0.1
    kelly_fraction: 0.25
    min_volume: 1000
    timeframes:
    - 5m
    - 15m
  toxicity_mm:
    kelly_fraction: 0.2
    max_position: 1000
    min_seconds_to_expiry_for_new_orders: 90
    quote_reprice_threshold: 0.005
    quote_size_reduction_refresh_pct: 0.10
    quote_ttl_seconds: 15
    strict_controls:
      enabled: true
      no_fresh_quotes_under_tte_seconds: 90
      spot_veto_move_pct: 0.30
      spot_veto_momentum: 0.60
      adverse_move_pct: 0.08
      adverse_momentum: 0.15
      adverse_size_multiplier: 0.50
      tte_spread_multipliers:
        early: 1.0
        mid: 1.6
        late: 2.5
        endgame: 4.0
    spread_multiplier: 1.5
    timeframes:
    - 5m
    - 15m
    vpin_threshold: 0.5
  opening_range:
    opening_range_ticks: 3
    breakout_pct: 0.3
    min_volume: 5000
    min_seconds_to_expiry_for_new_orders: 180
  time_decay:
    min_seconds_left: 10
    max_seconds_left: 60
    min_price: 0.55
    max_price: 0.92
    min_notional_usd: 1.0
    max_notional_usd: 6.0
    directional_signal_entry_style: resting_limit
    min_seconds_to_expiry_for_new_orders: 0
  spot_momentum:
    min_abs_spot_move_pct: 0.20
    min_tte_pct: 0.20
    max_tte_pct: 0.70
    max_entry_price: 0.70
    base_notional_usd: 2.0
    move_notional_multiplier: 4.0
    max_notional_usd: 6.0
    directional_signal_entry_style: resting_limit
  market_open_probe:
    # PAPER ONLY: one tiny marketable probe in every open 5m/15m market when no
    # other strategy already has exposure. Labels data for autoresearch rather
    # than pretending this is proven alpha.
    notional_usd: 1.0
    min_entry_price: 0.02
    max_entry_price: 0.98
    spot_move_threshold_pct: 0.02
    directional_signal_entry_style: marketable
    min_seconds_to_expiry_for_new_orders: 0
  terminal_fair_value:
    # Paper-active fair-value taker: only enters when live spot-implied terminal
    # probability clears executable ask by a large edge. This encodes the
    # bookmark thesis: short-window money is execution/fair-value lag, not vibes.
    model: gbm
    annualized_vol: 0.8
    annualized_drift: 0.0
    max_tte_seconds: 60
    max_active_tte_seconds: 60
    max_book_age_ms: 500
    max_spot_age_ms: 1000
    max_spread: 0.06
    min_scanner_edge: 0.08
    min_active_edge: 0.12
    min_taker_edge: 0.12
    min_entry_price: 0.02
    max_entry_price: 0.88
    base_notional_usd: 0.5
    edge_notional_multiplier: 8.0
    max_notional_usd: 2.0
    directional_signal_entry_style: marketable
    min_seconds_to_expiry_for_new_orders: 0
runtime:
  dir: data/runtime
research:
  bucket_pause_enabled: true
  bucket_pause_warn_only: false
  bucket_pause_min_settled_trades: 20
  edge_enforcement:
    enabled: true
    operator_approved_paper_auto_activation: true
    require_gate_green: true
    max_active_strategies: 5
    min_settled_trades: 30
    min_win_rate: 0.45
    min_pnl_per_trade: 0.05
    demote_settled_trades: 20
    demote_pnl_per_trade_below: -0.20
telegram:
  enabled: false
